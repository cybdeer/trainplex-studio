[pytest]
DJANGO_SETTINGS_MODULE = core.settings.label_studio
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
# --strict-markers : unknown @pytest.mark.<x> fails fast instead of silently skipping
# -p no:warnings   : keep the legacy noise filter from the original config
addopts = --strict-markers -p no:warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration_tests: marks tests as integration (deselect with '-m "not integration_tests"')
    rbac: marks RBAC-related tests (TrainPlex Step 1.4-A)
    i18n: marks i18n-related tests (TrainPlex Step 1.4-C)
    security_wireup: marks security decorator/audit wire-in tests (TrainPlex Step 12)
tavern-global-cfg=
    tests/shared_stages.yml
env =
    D:SENTRY_RATE=0
    D:SENTRY_DSN=
    D:USE_ENFORCE_CSRF_CHECKS=0
    D:TEST_ENVIRONMENT=1
    COLLECT_ANALYTICS=0
    fflag_feat_fit_568_finite_state_management=1
