name: "TrainPlex Studio - Test"

# Runs on every PR + push to develop/main per Phase 1 Step 10.
#
# Scope: TrainPlex-specific files only. Upstream Label Studio tests + lint
# are NOT run here — they live in disabled workflows and have known
# divergence from our customizations.
#
# Jobs:
#   - lint-trainplex   : black + ruff on TrainPlex-added Python files
#   - test-trainplex   : pytest only on TrainPlex test files
#
# Upstream-dependent jobs (test all 1271 LS tests, full Docker build,
# full yarn install) are deferred until Week 9+ when:
#   1. We've fully migrated existing data
#   2. We've fixed upstream test failures unique to our fork
#   3. We've added bind-mounted source dev container

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

concurrency:
  group: trainplex-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  DJANGO_DB: sqlite
  COLLECT_ANALYTICS: "false"
  LABEL_STUDIO_TEST_ENVIRONMENT: "false"
  SENTRY_RATE: "0"
  JSON_LOG: "0"

jobs:
  # ---------------------------------------------------------------------------
  lint-trainplex:
    name: "Lint TrainPlex Python"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "black==24.10.0" "ruff==0.7.4"

      - name: Lint TrainPlex-added files only
        run: |
          # Files we own — keep this list in sync with PRs touching new code
          PATHS=(
            label_studio/users/decorators
            label_studio/users/tests/test_role_rbac.py
            label_studio/users/migrations/0012_add_role_field.py
          )

          EXISTING=()
          for p in "${PATHS[@]}"; do
            if [ -e "$p" ]; then
              EXISTING+=("$p")
            fi
          done

          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "No TrainPlex Python files to lint yet — skipping."
            exit 0
          fi

          echo "Linting: ${EXISTING[*]}"
          black --check --diff "${EXISTING[@]}"
          ruff check "${EXISTING[@]}"

  # ---------------------------------------------------------------------------
  test-trainplex:
    name: "Test TrainPlex pytest"
    runs-on: ubuntu-latest
    env:
      SENTRY_ENVIRONMENT: ci-test-trainplex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        run: pipx install "poetry==2.3.2"

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev

      - name: Install Python dependencies (with test extras)
        run: poetry install --with test

      - name: Generate version file
        run: poetry run python label_studio/core/version.py

      - name: Run TrainPlex-only tests
        working-directory: label_studio
        run: |
          # Discover only TrainPlex test files. Each is opt-in by filename.
          TESTS=()
          if [ -f users/tests/test_role_rbac.py ]; then
            TESTS+=(users/tests/test_role_rbac.py)
          fi
          if [ -f tests/test_fixtures_smoke.py ]; then
            TESTS+=(tests/test_fixtures_smoke.py)
          fi
          if [ -f tests/test_trainplex_templates.py ]; then
            TESTS+=(tests/test_trainplex_templates.py)
          fi

          if [ ${#TESTS[@]} -eq 0 ]; then
            echo "No TrainPlex test files to run yet — skipping."
            exit 0
          fi

          echo "Running: ${TESTS[*]}"
          poetry run pytest -v --tb=short --disable-warnings "${TESTS[@]}"

  # ---------------------------------------------------------------------------
  # Codex audit M5 (2026-05-16) — production smoke gate.
  #
  # Runs on develop + main after lint + tests pass. Hits three production URLs
  # and fails the build if any returns non-200, so a green CI badge means
  # the deployed surface actually responded.
  # ---------------------------------------------------------------------------
  production-smoke:
    name: "Production smoke (develop + main)"
    needs: [lint-trainplex, test-trainplex]
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Smoke /label-studio/user/login/
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://app.trainplex.in/label-studio/user/login/")
          echo "code=$code"
          [ "$code" = "200" ] || { echo "FAIL /label-studio/user/login/ code=$code"; exit 1; }

      - name: Smoke /label-studio/health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://app.trainplex.in/label-studio/health")
          echo "code=$code"
          [ "$code" = "200" ] || { echo "FAIL /label-studio/health code=$code"; exit 1; }

      - name: Smoke /admin/dashboard
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://app.trainplex.in/admin/dashboard")
          echo "code=$code"
          [ "$code" = "200" ] || { echo "FAIL /admin/dashboard code=$code"; exit 1; }
