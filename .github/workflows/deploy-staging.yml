name: "TrainPlex Studio - Deploy Staging"

# Runs on every push to develop. Builds + pushes a Docker image to GHCR,
# SSHes into the staging server, pulls the new image, restarts via
# docker-compose, runs a /health smoke test, and pings WhatsApp on failure.

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

concurrency:
  group: trainplex-deploy-staging
  cancel-in-progress: false # don't kill an in-flight deploy

permissions:
  contents: read
  packages: write # required to push to ghcr.io

env:
  REGISTRY: ghcr.io
  # Image name follows ghcr.io/<owner>/trainplex-studio
  IMAGE_NAME: ${{ github.repository_owner }}/trainplex-studio
  # Staging URL used for the smoke test. Override via repo variable if needed.
  STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.trainplex.studio' }}

jobs:
  build-and-push:
    name: "Build & Push to GHCR"
    runs-on: ubuntu-latest
    outputs:
      image_tag_sha: ${{ steps.meta.outputs.image_tag_sha }}
      image_tag_latest: ${{ steps.meta.outputs.image_tag_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute image tags
        id: meta
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "image_tag_sha=${IMG}:staging-${{ github.sha }}"     >> "$GITHUB_OUTPUT"
          echo "image_tag_latest=${IMG}:staging-latest"             >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-provisioned — no secret to add.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag_sha }}
            ${{ steps.meta.outputs.image_tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION_OVERRIDE=staging-${{ github.sha }}
            BRANCH_OVERRIDE=develop

  deploy:
    name: "Deploy to Staging Server"
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout (for docker-compose file references)
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Required secrets:
      #   STAGING_SSH_KEY   — private SSH key (PEM) for the deploy user
      #   STAGING_HOST      — staging server hostname or IP
      #   STAGING_USER      — SSH user (default: deploy)
      #   STAGING_SSH_PORT  — SSH port (default: 22)
      # ---------------------------------------------------------------------
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.STAGING_SSH_PORT || '22' }}" -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull image & restart container via docker-compose
        env:
          SSH_USER: ${{ secrets.STAGING_USER || 'deploy' }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
          IMAGE_TAG_SHA: ${{ needs.build-and-push.outputs.image_tag_sha }}
          IMAGE_TAG_LATEST: ${{ needs.build-and-push.outputs.image_tag_latest }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" bash -se <<EOF
            set -euo pipefail
            cd /opt/trainplex-studio
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            export TRAINPLEX_IMAGE="${IMAGE_TAG_SHA}"
            docker pull "\$TRAINPLEX_IMAGE"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          EOF

      - name: Smoke test (curl /health)
        id: smoke
        run: |
          set -e
          # Give the container up to 60s to come up, then probe /health.
          for i in $(seq 1 12); do
            STATUS=$(curl -k -s -o /tmp/health.out -w "%{http_code}" "${{ env.STAGING_URL }}/health" || echo "000")
            echo "attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test FAILED. Last body:"
          cat /tmp/health.out || true
          exit 1

      - name: Notify WhatsApp on failure
        if: failure()
        env:
          # WA_NOTIFY_WEBHOOK — webhook URL that accepts a JSON {text} payload
          # and forwards to the ops WhatsApp group via official channels only.
          # NEVER use the founder's personal number here.
          WA_WEBHOOK: ${{ secrets.WA_NOTIFY_WEBHOOK }}
        run: |
          if [ -z "${WA_WEBHOOK}" ]; then
            echo "WA_NOTIFY_WEBHOOK not configured — skipping notification."
            exit 0
          fi
          MSG="TrainPlex Studio STAGING deploy FAILED. SHA=${{ github.sha }} Run=${{ github.run_id }}"
          curl -fsSL -X POST "${WA_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"${MSG}\"}" || echo "WA notify failed; non-blocking."
